[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-trinity"
version = "1.0.0"
description = "A three-role coding team coordinated through Herdr"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
trinity = "trinity.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["trinity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
